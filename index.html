<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live TV</title>

  <!-- HLS Player -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 65px;
      background: #000;
      border-bottom: 1px solid #292929;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 15px;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
    }

    /* Search */
    .search-box {
      width: 230px;
    }

    .search-box input {
      width: 100%;
      background: #1c1c1c;
      color: #fff;
      border: 1px solid #333;
      outline: none;

      padding: 10px 15px;
      border-radius: 22px;

      font-size: 14px;
    }

    .search-box input::placeholder {
      color: #aaa;
    }

    /* Main */
    .container {
      width: 100%;
      max-width: 650px;
      margin: 20px auto;
      padding: 0 10px;
    }

    /* TV Post */
    .post {
      background: #111;
      border: 1px solid #292929;
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    /* TV Header */
    .post-header {
      display: flex;
      align-items: center;
      padding: 14px;
    }

    .avatar {
      width: 45px;
      height: 45px;

      background: #222;
      color: #fff;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: bold;
      margin-right: 10px;
    }

    .post-title {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
    }

    .live {
      color: #ff3030;
      font-size: 12px;
      margin-top: 4px;
    }

    /* Video */
    .video-box {
      width: 100%;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      background: #000;
      aspect-ratio: 16 / 9;
    }

    /* Play Button */
    .play-button {
      display: block;

      width: calc(100% - 30px);
      margin: 15px;

      padding: 12px;

      border: 1px solid #444;
      border-radius: 7px;

      background: #000;
      color: #fff;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    .play-button:hover {
      background: #222;
    }

    /* Like Section */
    .actions {
      border-top: 1px solid #292929;

      display: flex;
      align-items: center;

      padding: 10px 15px;
    }

    .like-button {
      background: transparent;
      border: none;

      color: #fff;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      padding: 7px 12px;
      border-radius: 6px;
    }

    .like-button:hover {
      background: #222;
    }

    .like-button.liked {
      color: #1877f2;
    }

    .like-count {
      color: #aaa;
      margin-left: 5px;
      font-size: 14px;
    }

    /* No Results */
    .no-results {
      display: none;

      text-align: center;
      padding: 40px 10px;

      color: #aaa;
      font-size: 16px;
    }

    /* Bottom space */
    .footer-space {
      height: 150px;
    }

    /* Mobile */
    @media (max-width: 600px) {

      .header {
        height: auto;
        min-height: 65px;

        padding: 10px;

        gap: 10px;
      }

      .logo {
        font-size: 19px;
      }

      .search-box {
        width: 180px;
      }

      .container {
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>

    <div class="logo">

    </div>

    <div class="search-box">
      <input

        id="searchInput"
        placeholder="Search TV..."
        oninput="searchTV()"

  <!-- Main -->

    <!-- ========================= -->

    <!-- ========================= -->

      <div class="post-header">

        <div>

          </div>
        </div>

      </div>


      <div class="video-box">

        <video

          preload="none">
        </video>

      </div>


      <button
        class="play-button"
        onclick="playTV(2, 'https://eshgh.tv/channel.php?cid=882')">

    <!-- ========================= -->

        <div>

          </div>

      </div>


      <div class="video-box">

    <div class="post tv-post" data-name="Tolo News">

      <div class="post-header">

        <div class="avatar">

        </div>

        <div>

      <div class="video-box">

  </main>



  <script>

    /* ===================================
       HLS PLAYERS
    =================================== */

    const players = {};


    function playTV(id, url) {

      const video =
        document.getElementById("video" + id);


      /* Stop other videos */

      document.querySelectorAll("video").forEach(function(v) {

        if (v !== video) {
          v.pause();
        }

      });


      /* Destroy old HLS player */

      if (players[id]) {

        players[id].destroy();

        players[id] = null;

      }


      /* Safari / Native HLS */

      if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        video.src = url;

        video.play().catch(function(error) {

          console.log(error);

        });

      }


      /* Chrome / Android */

      else if (Hls.isSupported()) {

        const hls = new Hls();

        players[id] = hls;

        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
          Hls.Events.MANIFEST_PARSED,
          function() {

            video.play().catch(function(error) {

              console.log(error);

            });

          }
        );


        hls.on(
          Hls.Events.ERROR,
          function(event, data) {

            console.log(
              "HLS Error:",
              data
            );

          }
        );

      }


      else {

        alert(
          "Your browser does not support HLS."
        );

      }

    }



    /* ===================================
       LIKE SYSTEM
    =================================== */

    function loadLikes() {

      for (let i = 1; i <= 4; i++) {

        let count =
          localStorage.getItem(
            "tvLikeCount" + i
          );

        let liked =
          localStorage.getItem(
            "tvLiked" + i
          );


        if (!count) {
          count = 0;
        }


        document.getElementById(
          "likeCount" + i
        ).textContent = count;


        if (liked === "true") {

          document.getElementById(
            "likeButton" + i
          ).classList.add("liked");

        }

      }

    }



    function likeTV(id) {

      let count = parseInt(
        localStorage.getItem(
          "tvLikeCount" + id
        ) || 0
      );


      let liked =
        localStorage.getItem(
          "tvLiked" + id
        ) === "true";


      if (!liked) {

        count++;

        localStorage.setItem(
          "tvLikeCount" + id,
          count
        );

        localStorage.setItem(
          "tvLiked" + id,
          "true"
        );

      }


      document.getElementById(
        "likeCount" + id
      ).textContent = count;


      document.getElementById(
        "likeButton" + id
      ).classList.add("liked");

    }



    /* ===================================
       SEARCH
    =================================== */

    function searchTV() {

      const search =
        document.getElementById(
          "searchInput"
        ).value
        .toLowerCase()
        .trim();


      const posts =
        document.querySelectorAll(
          ".tv-post"
        );


      let found = 0;


      posts.forEach(function(post) {

        const name =
          post.dataset.name
          .toLowerCase();


        if (
          name.includes(search)
        ) {

          post.style.display = "block";

          found++;

        }

        else {

          post.style.display = "none";

        }

      });


      const noResults =
        document.getElementById(
          "noResults"
        );


      if (found === 0) {

        noResults.style.display =
          "block";

      }

      else {

        noResults.style.display =
          "none";

      }

    }



    /* Load likes when page opens */

    loadLikes();

  </script>
