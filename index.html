<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WADAN NEWS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         TOP NAVIGATION
    ========================== -->

    <header class="navbar">

        <nav>

            <a href="#" class="nav-item active">
                <span class="icon">⌂</span>
                <span>Home</span>
            </a>

            <a href="#" class="nav-item">
                <span class="icon">▣</span>
                <span>Live Matches</span>
            </a>

            <a href="#" class="nav-item">
                <span class="icon">▦</span>
                <span>Schedule</span>
            </a>

            <a href="#" class="nav-item">
                <span class="icon">♟</span>
                <span>Teams</span>
            </a>

            <a href="#" class="nav-item">
                <span class="icon">▤</span>
                <span>News</span>
            </a>

        </nav>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <div class="page-title">

            <span class="live-badge">
                LIVE
            </span>

            <h1>
                WADAN NEWS
            </h1>

        </div>


        <!-- =========================
             LIVE VIDEO
        ========================== -->

        <section class="live-section">

            <div class="video-box">

                <div class="video-live-label">
                    LIVE
                </div>

                <iframe
                    src="https://liveland.af/channels/af-sports"
                    title="AF Sports Live"
                    allow="autoplay; fullscreen; picture-in-picture"
                    allowfullscreen>
                </iframe>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <h2>
            WADAN NEWS
        </h2>

    </footer>

</body>
</html>
